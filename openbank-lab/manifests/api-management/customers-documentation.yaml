apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: customers-documentation
  namespace: openbank-core
spec:
  parentRefs:
    - name: openbank-gateway
      namespace: openbank-gateway
      sectionName: http
  hostnames:
    - "api-openbank.apps.cluster-mbh58.dyn.redhatworkshops.io"
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /documentation/customers/openapi.json
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /openapi.json
      backendRefs:
        - name: customers-api
          port: 8080
