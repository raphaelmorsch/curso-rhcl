apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: legacy
  namespace: openbank-core
  labels:
    app: legacy-api
    app.kubernetes.io/part-of: openbank
spec:
  parentRefs:
    - name: openbank-gateway
      namespace: openbank-gateway
      sectionName: http
  hostnames:
    - "api-openbank.apps.cluster-mbh58.dyn.redhatworkshops.io"
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Bank-Channel
                value: "connectivity-link"
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-OpenBank-Gateway
                value: "managed"
      matches:
        - path:
            type: PathPrefix
            value: /legacy
      backendRefs:
        - name: legacy-api
          port: 8080
