apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: customers
  namespace: openbank-core
spec:
  parentRefs:
    - name: openbank-gateway
      namespace: openbank-gateway
      sectionName: http
  hostnames:
    - "api-openbank.apps.cluster-mbh58.dyn.redhatworkshops.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /customers
          headers:
            - name: X-API-Version
              type: Exact
              value: v2
      backendRefs:
        - name: customers-api-v2
          port: 8080

    - matches:
        - path:
            type: PathPrefix
            value: /customers
      backendRefs:
        - name: customers-api
          port: 8080
